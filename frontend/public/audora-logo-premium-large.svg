<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradients -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Subtle shadow filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Main circle with enhanced styling -->
  <circle cx="20" cy="20" r="18" fill="url(#mainGradient)" stroke="#701a75" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="20" cy="20" r="18" fill="url(#innerGlow)"/>
  
  <!-- Premium headphones design -->
  <g transform="translate(20, 20)">
    <!-- Headband with padding -->
    <path d="M-10 -4 Q-5 -11 0 -11 Q5 -11 10 -4" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M-8 -3 Q-4 -9 0 -9 Q4 -9 8 -3" stroke="#ffffff50" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    
    <!-- Left ear cup with depth -->
    <circle cx="-8.5" cy="3" r="4.2" fill="white" opacity="0.95"/>
    <circle cx="-8.5" cy="3" r="3.3" fill="#a855f7"/>
    <circle cx="-8.5" cy="3" r="2" fill="#7c3aed"/>
    <circle cx="-7.5" cy="2.2" r="0.7" fill="#ffffff70"/>
    
    <!-- Right ear cup with depth -->
    <circle cx="8.5" cy="3" r="4.2" fill="white" opacity="0.95"/>
    <circle cx="8.5" cy="3" r="3.3" fill="#a855f7"/>
    <circle cx="8.5" cy="3" r="2" fill="#7c3aed"/>
    <circle cx="9.5" cy="2.2" r="0.7" fill="#ffffff70"/>
  </g>
  
  <!-- Enhanced audio spectrum -->
  <g opacity="0.9" transform="translate(0, 28)">
    <rect x="4" y="2" width="1.5" height="5" fill="white" rx="0.75">
      <animate attributeName="height" values="2.5;7;3.5;6;2.5" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3.75;-1.5;2.25;0;3.75" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="6.5" y="0" width="1.5" height="9" fill="white" rx="0.75">
      <animate attributeName="height" values="5;10;7;9;5" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;-1;1.5;0;2" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="9" y="1" width="1.5" height="7" fill="white" rx="0.75">
      <animate attributeName="height" values="3.5;8;5;7;3.5" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2.75;-1;1.5;0.5;2.75" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Mirror on right side -->
    <rect x="29" y="1" width="1.5" height="7" fill="white" rx="0.75">
      <animate attributeName="height" values="3.5;8;5;7;3.5" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2.75;-1;1.5;0.5;2.75" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="31.5" y="0" width="1.5" height="9" fill="white" rx="0.75">
      <animate attributeName="height" values="5;10;7;9;5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;-1;1.5;0;2" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="2" width="1.5" height="5" fill="white" rx="0.75">
      <animate attributeName="height" values="2.5;7;3.5;6;2.5" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="3.75;-1.5;2.25;0;3.75" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Refined sound waves -->
  <g opacity="0.7">
    <path d="M30 14 Q34 20 30 26" stroke="url(#waveGradient)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M32 11 Q37 20 32 29" stroke="url(#waveGradient)" stroke-width="1.1" fill="none">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M35 16 Q37 20 35 24" stroke="url(#waveGradient)" stroke-width="0.8" fill="none">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating musical elements -->
  <g opacity="0.8">
    <!-- Musical note -->
    <g transform="translate(8, 9)">
      <ellipse cx="0" cy="2.5" rx="1.2" ry="0.9" fill="white">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="1" y="-2" width="0.4" height="5" fill="white">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Small note -->
    <circle cx="32" cy="8" r="1" fill="white">
      <animate attributeName="cy" values="8;6;8" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>