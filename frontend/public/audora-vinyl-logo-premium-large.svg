<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradient for the vinyl record -->
    <radialGradient id="vinylGradientPremiumLarge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#3c2985;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1e1248;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0729;stop-opacity:1" />
    </radialGradient>
    
    <!-- Premium gold gradient for the label -->
    <radialGradient id="labelGradientPremiumLarge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </radialGradient>
    
    <!-- Premium shine effect -->
    <linearGradient id="shineGradientPremium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer vinyl record -->
  <circle cx="32" cy="32" r="30" fill="url(#vinylGradientPremiumLarge)" stroke="#4c1d95" stroke-width="1"/>
  
  <!-- Vinyl grooves -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#4c1d95" stroke-width="0.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#4c1d95" stroke-width="0.5" opacity="0.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#4c1d95" stroke-width="0.5" opacity="0.4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#4c1d95" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Center label -->
  <circle cx="32" cy="32" r="12" fill="url(#labelGradientPremiumLarge)"/>
  
  <!-- Center hole -->
  <circle cx="32" cy="32" r="3" fill="#0f0729"/>
  
  <!-- Text on label -->
  <text x="32" y="28" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#0f0729" opacity="0.95">AUDORA</text>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="3" text-anchor="middle" fill="#0f0729" opacity="0.8">PREMIUM</text>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="2" text-anchor="middle" fill="#0f0729" opacity="0.6">MUSIC</text>
  
  <!-- Premium shine effect -->
  <circle cx="32" cy="32" r="30" fill="url(#shineGradientPremium)"/>
  
  <!-- Premium glow -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#labelGradientPremiumLarge)" stroke-width="1" opacity="0.5"/>
</svg>