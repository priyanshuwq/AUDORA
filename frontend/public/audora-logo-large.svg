<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="url(#bgGradient)" stroke="#701a75" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="18" fill="url(#centerGlow)"/>
  
  <!-- Headphones -->
  <g transform="translate(20, 20)">
    <!-- Headband -->
    <path d="M-10 -3 Q0 -10 10 -3" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Left ear cup -->
    <circle cx="-9" cy="3" r="4" fill="white" opacity="0.9"/>
    <circle cx="-9" cy="3" r="2.5" fill="#a855f7"/>
    
    <!-- Right ear cup -->
    <circle cx="9" cy="3" r="4" fill="white" opacity="0.9"/>
    <circle cx="9" cy="3" r="2.5" fill="#a855f7"/>
  </g>
  
  <!-- Audio waveform -->
  <g opacity="0.8">
    <rect x="5" y="30" width="1.5" height="5" fill="white" rx="0.75">
      <animate attributeName="height" values="2.5;5;3.5;5;2.5" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="7.5" y="28" width="1.5" height="9" fill="white" rx="0.75">
      <animate attributeName="height" values="5;9;7;9;5" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="29" width="1.5" height="7" fill="white" rx="0.75">
      <animate attributeName="height" values="3.5;7;5;7;3.5" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="29" width="1.5" height="7" fill="white" rx="0.75">
      <animate attributeName="height" values="3.5;7;5;7;3.5" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="30.5" y="28" width="1.5" height="9" fill="white" rx="0.75">
      <animate attributeName="height" values="5;9;7;9;5" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="33" y="30" width="1.5" height="5" fill="white" rx="0.75">
      <animate attributeName="height" values="2.5;5;3.5;5;2.5" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Sound waves -->
  <g opacity="0.6">
    <path d="M30 15 Q33 20 30 25" stroke="url(#waveGradient)" stroke-width="1.5" fill="none">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M32 12 Q36 20 32 28" stroke="url(#waveGradient)" stroke-width="1" fill="none">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Musical notes -->
  <g opacity="0.7">
    <circle cx="8" cy="10" r="1" fill="white">
      <animate attributeName="cy" values="10;8;10" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="8" r="0.8" fill="white">
      <animate attributeName="cy" values="8;6;8" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>