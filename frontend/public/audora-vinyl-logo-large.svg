<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the vinyl record -->
    <radialGradient id="vinylGradientLarge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1f1f1f;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Gradient for the label -->
    <radialGradient id="labelGradientLarge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </radialGradient>
    
    <!-- Shine effect -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer vinyl record -->
  <circle cx="32" cy="32" r="30" fill="url(#vinylGradientLarge)" stroke="#333" stroke-width="1"/>
  
  <!-- Vinyl grooves -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#333" stroke-width="0.5" opacity="0.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#333" stroke-width="0.5" opacity="0.4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#333" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Center label -->
  <circle cx="32" cy="32" r="12" fill="url(#labelGradientLarge)"/>
  
  <!-- Center hole -->
  <circle cx="32" cy="32" r="3" fill="#000"/>
  
  <!-- Text on label -->
  <text x="32" y="28" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="white" opacity="0.95">AUDORA</text>
  <text x="32" y="34" font-family="Arial, sans-serif" font-size="3" text-anchor="middle" fill="white" opacity="0.8">MUSIC</text>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="2" text-anchor="middle" fill="white" opacity="0.6">STREAMING</text>
  
  <!-- Shine effect -->
  <circle cx="32" cy="32" r="30" fill="url(#shineGradient)"/>
  
  <!-- Subtle highlight -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#labelGradientLarge)" stroke-width="1" opacity="0.4"/>
</svg>